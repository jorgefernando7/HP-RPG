<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Personagem - Ordem Paranormal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>HP RPG</h1>

    <h2>Criar Personagem</h2>

    <p>Ordem Paranormal</p>

    <form method="POST">

        <!-- INFORMAÇÕES BÁSICAS -->

        <h3>Informações do Personagem</h3>

        <div class="campo">
            <label for="nome">Nome do personagem</label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite o nome"
                required>
        </div>


        <div class="campo">
            <label for="idade">Idade</label>

            <input
                type="number"
                id="idade"
                name="idade"
                min="0"
                placeholder="Digite a idade">
        </div>


        <div class="campo">
            <label for="descricao">Descrição</label>

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva seu personagem..."></textarea>
        </div>


        <!-- PROGRESSÃO -->

        <h3>Progressão</h3>

        <div class="campo">
            <label for="nex">NEX</label>

            <select id="nex" name="nex">
                <option value="5">5%</option>
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>
        </div>


        <!-- ORIGEM -->

        <h3>Origem</h3>

        <div class="campo">

            <label for="origem">Escolha sua origem</label>

            <select id="origem" name="origem">

                <option value="">Selecione uma origem</option>

                <option value="origem_1">
                    Origem 1
                </option>

                <option value="origem_2">
                    Origem 2
                </option>

            </select>

        </div>


        <!-- CLASSE -->

        <h3>Classe</h3>

        <div class="campo">
            <label for="classe">Classe</label>

            <select id="classe" name="classe" required>

                <option value="">
                    Selecione uma classe
                </option>

                {% for codigo, classe in classes.items() %}

                    <option value="{{ codigo }}">
                        {{ classe.nome }}
                    </option>

                {% endfor %}

            </select>

            <label for="origem">Origem</label>

            <select id="origem" name="origem" required>

                <option value="">
                    Selecione uma origem
                </option>

                {% for codigo, origem in origens.items() %}

                    <option value="{{ codigo }}">
                        {{ origem.nome }}
                    </option>

                {% endfor %}

            </select>
        </div>

        <!-- ATRIBUTOS -->

        <h3>Atributos</h3>

        <div class="campo">

            <label for="agilidade">
                Agilidade
            </label>

            <input
                type="number"
                id="agilidade"
                name="agilidade"
                value="1"
                min="0">
        </div>


        <div class="campo">

            <label for="forca">
                Força
            </label>

            <input
                type="number"
                id="forca"
                name="forca"
                value="1"
                min="0">
        </div>


        <div class="campo">

            <label for="intelecto">
                Intelecto
            </label>

            <input
                type="number"
                id="intelecto"
                name="intelecto"
                value="1"
                min="0">
        </div>


        <div class="campo">

            <label for="presenca">
                Presença
            </label>

            <input
                type="number"
                id="presenca"
                name="presenca"
                value="1"
                min="0">
        </div>


        <div class="campo">

            <label for="vigor">
                Vigor
            </label>

            <input
                type="number"
                id="vigor"
                name="vigor"
                value="1"
                min="0">
        </div>


        <!-- RECURSOS -->

        <h3>Recursos</h3>

        <div class="campo">

            <label for="pv">
                Pontos de Vida
            </label>

            <input
                type="number"
                id="pv"
                name="pv"
                readonly>
        </div>


        <div class="campo">

            <label for="pe">
                Pontos de Esforço
            </label>

            <input
                type="number"
                id="pe"
                name="pe"
                readonly>
        </div>


        <div class="campo">

            <label for="sanidade">
                Sanidade
            </label>

            <input
                type="number"
                id="sanidade"
                name="sanidade"
                readonly>
        </div>

        <!-- PERÍCIAS -->

        <h3>Perícias</h3>

        <div class="campo">

            <label for="pericias">
                Perícias
            </label>

            <textarea
                id="pericias"
                name="pericias"
                placeholder="As perícias serão definidas de acordo com a criação do personagem."></textarea>

        </div>


        <!-- HISTÓRIA -->

        <h3>História</h3>

        <div class="campo">

            <label for="historia">
                História do personagem
            </label>

            <textarea
                id="historia"
                name="historia"
                placeholder="Conte a história do seu personagem..."></textarea>

        </div>


        <!-- BOTÃO -->

        <button
            type="submit"
            class="botao">

            Criar Personagem

        </button>

    </form>

</body>

</html>
