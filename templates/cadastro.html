<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>HP RPG - Cadastro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="cadastro">

        <h1>HP RPG</h1>

        <h2>Crie seu usuário</h2>

    
    <form action="{{ url_for('cadastro') }}" method="POST">

        <div class="campo">
            <label for="usuario">Nome de Usuário</label>
             <input
                type="text"
                id="usuario"
                name="nome"
                placeholder="Digite seu usuário"
                required>
        </div>

        <div class="campo">
        <label for="email">Insira um E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required>
        </div>

        <div class="campo">
        <label for="senha">Crie uma senha</label>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            required>
        </div>

        <button type="submit">Cadastrar</button>

    </form>



    </div>

</body>

</html>
